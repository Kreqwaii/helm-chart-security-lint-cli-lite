[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "helm-chart-security-lint-cli-lite"
version = "0.1.0"
description = "Zero-dependency Python 3.9+ CLI for static security auditing of Helm charts (Chart.yaml, values.yaml, templates/*.yaml)."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["helm", "kubernetes", "security", "lint", "devsecops", "yaml", "audit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
helm-lint = "helm_lint.cli:main"

[tool.setuptools.packages.find]
include = ["helm_lint*"]
